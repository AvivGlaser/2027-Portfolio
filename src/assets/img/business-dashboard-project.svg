<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0638"/>
      <stop offset="1" stop-color="#0a090a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aa367c"/>
      <stop offset="1" stop-color="#4a2fbd"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05fb0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a2fbd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="880" cy="470" r="200" fill="#4a2fbd" opacity="0.18"/>

  <!-- Window -->
  <rect x="40" y="36" width="880" height="468" rx="20" fill="#141019" stroke="#2e2440" stroke-width="2"/>
  <circle cx="72" cy="66" r="7" fill="#e05fb0"/><circle cx="96" cy="66" r="7" fill="#b48cff"/><circle cx="120" cy="66" r="7" fill="#5b5470"/>
  <text x="150" y="73" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffe4e8">Business Metrics Dashboard</text>

  <!-- Inputs -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a99fbf">
    <text x="70" y="120">Revenue</text><rect x="70" y="130" width="190" height="38" rx="8" fill="#1f1830" stroke="#3a3050"/><text x="84" y="155" fill="#fff" font-size="17">$ 1,250,000</text>
    <text x="70" y="200">Investment</text><rect x="70" y="210" width="190" height="38" rx="8" fill="#1f1830" stroke="#3a3050"/><text x="84" y="235" fill="#fff" font-size="17">$ 420,000</text>
    <text x="70" y="280">Active accounts</text><rect x="70" y="290" width="190" height="38" rx="8" fill="#1f1830" stroke="#3a3050"/><text x="84" y="315" fill="#fff" font-size="17">340</text>
  </g>
  <rect x="70" y="350" width="190" height="44" rx="10" fill="url(#brand)"/>
  <text x="165" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff">Calculate</text>

  <!-- KPI tiles -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="290" y="100" width="140" height="92" rx="14" fill="#1f1830"/>
    <text x="306" y="128" font-size="14" fill="#a99fbf">ROI</text>
    <text x="306" y="170" font-size="32" font-weight="700" fill="#06d6a0">198%</text>

    <rect x="446" y="100" width="140" height="92" rx="14" fill="#1f1830"/>
    <text x="462" y="128" font-size="14" fill="#a99fbf">Net retention</text>
    <text x="462" y="170" font-size="32" font-weight="700" fill="#fff">114%</text>

    <rect x="602" y="100" width="140" height="92" rx="14" fill="#1f1830"/>
    <text x="618" y="128" font-size="14" fill="#a99fbf">Upsell potential</text>
    <text x="618" y="170" font-size="32" font-weight="700" fill="#f7a8d8">$86K</text>

    <rect x="758" y="100" width="140" height="92" rx="14" fill="#1f1830"/>
    <text x="774" y="128" font-size="14" fill="#a99fbf">Cross-sell</text>
    <text x="774" y="170" font-size="32" font-weight="700" fill="#b48cff">2.4x</text>
  </g>

  <!-- Trend chart -->
  <rect x="290" y="210" width="452" height="270" rx="14" fill="#1f1830"/>
  <g stroke="#2e2440" stroke-width="1">
    <line x1="310" y1="270" x2="722" y2="270"/><line x1="310" y1="330" x2="722" y2="330"/><line x1="310" y1="390" x2="722" y2="390"/><line x1="310" y1="450" x2="722" y2="450"/>
  </g>
  <path d="M310 430 C360 410 390 420 430 380 S520 350 560 320 S650 280 722 250 L722 460 L310 460 Z" fill="url(#area)"/>
  <path d="M310 430 C360 410 390 420 430 380 S520 350 560 320 S650 280 722 250" fill="none" stroke="#e05fb0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="722" cy="250" r="7" fill="#e05fb0"/>
  <text x="310" y="240" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a99fbf">Revenue trend</text>

  <!-- Donut -->
  <rect x="758" y="210" width="140" height="270" rx="14" fill="#1f1830"/>
  <circle cx="828" cy="320" r="46" fill="none" stroke="#2e2440" stroke-width="18"/>
  <circle cx="828" cy="320" r="46" fill="none" stroke="url(#brand)" stroke-width="18" stroke-dasharray="210 289" transform="rotate(-90 828 320)" stroke-linecap="round"/>
  <text x="828" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">73%</text>
  <text x="828" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a99fbf">KPI target</text>
  <text x="828" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a99fbf">reached</text>
</svg>
